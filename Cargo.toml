[package]
name = "adb_portscan"
version = "0.4.0"
edition = "2021"
description = "Find Android ADB wireless-debugging ports on a LAN via full-port scan and protocol fingerprinting. Usable as both a library and a binary."
license = "MIT"
repository = "https://github.com/Abei-hhh/adb_portscan"
keywords = ["adb", "android", "portscan", "wireless-debugging", "mdns"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"

[lib]
name = "adb_portscan"
path = "src/lib.rs"

[[bin]]
name = "adb_portScan"
path = "src/main.rs"

[[bin]]
name = "adb_portScan_gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
eframe = { version = "0.36.1", optional = true }

[features]
default = ["mdns", "gui"]
mdns = []
gui = ["dep:eframe", "mdns"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
